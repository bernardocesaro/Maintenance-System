<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard - Sistema de Manutenção</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/forms.css">
        <link rel="stylesheet" href="../css/dashboard.css">
    </head>
    <body class="bg-light">
        <div class="container-fluid">
            <div class="row">
                <aside class="col-md-3 col-lg-2 bg-dark text-white min-vh-100">
                    <h4 class="mb-4">Manutenção</h4>
                    <nav class="nav flex-column">
                        <a class="nav-link text-white active" href="#">Dashboard</a>
                        <a class="nav-link text-white" href="#">Equipamentos</a>
                        <a class="nav-link text-white" href="#">Categorias</a>
                        <a class="nav-link text-white" href="#">Tecnicos</a>
                    </nav>
                </aside>
                <main class="col-md-9 col-lg-10 p-4">
                    <form class="row g-3 mb-4">
                        <div class="col-md-8">
                            <input type="text" class="form-control" placeholder="Pesquisar Equipamento">
                        </div>
                        <div class="col-md-4">
                            <button class="btn btn-primary w-100">Pesquisar</button>
                        </div>
                    </form>
                    <div class="row g-4 mb-4">
                        <div class="col-md-4">
                            <div class="card shadow-sm">
                                <div class="card-body">
                                    <h6>Equipamentos Ativos</h6>
                                    <h2>48</h2>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card shadow-sm">
                                <div class="card-body">
                                    <h6>Manutenção Preventiva</h6>
                                    <h2>15</h2>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <table class="table table-striped table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>Equipamento</th>
                                    <th>Local</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Empacotadora</td>
                                    <td>Setor Peru A1</td>
                                    <td>Ativos</td>
                                </tr>
                                <tr>
                                    <td>Empacotadora Bandeja</td>
                                    <td>Setor Peru A1</td>
                                    <td>Manutenção</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </main>
            </div>
        </div>

        <footer>
            <p>2026 Sistema de Controle e Manutenção de Equipamentos ADS2026-2</p>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    </body>
